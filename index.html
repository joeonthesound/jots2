  <style>
    /* VARIABLES DE DISEÑO (TOKENS VISUALES) */
    :root {
      --primary: #4b00ff;
      --primary-hover: #611eff;
      --primary-glow: rgba(75, 0, 255, 0.4);
      --bg-absolute: #09090d;
      --bg-panel: #15151c;
      --bg-panel-hover: #1f1f2a;
      --text-main: #ffffff;
      --text-muted: #a0a0ba;
      --text-link: #d4c5ff;
      --accent-neon: #00f0ff;
      --spotify-green: #1db954;
      --spacing-sidebar: 260px;
      --border-radius-lg: 16px;
      --border-radius-md: 10px;
      --transition-standard: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* SOPORTE DE MOVIMIENTO REDUCIDO */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* RESTRICCIONES GENERALES Y RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-absolute);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* SCROLLBAR PERSONALIZADA */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-absolute);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-panel);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* LAYOUT PRINCIPAL CONTENEDOR */
    .app-container {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .app-container {
        flex-direction: row;
      }
    }

    /* HEADER Y NAVEGACIÓN DESKTOP (SIDEBAR) */
    .sidebar {
      background-color: var(--bg-absolute);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .sidebar {
        width: var(--spacing-sidebar);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 10;
        overflow-y: auto;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--text-main);
      margin-bottom: 2.5rem;
    }

    .brand-logo-container {
      width: 48px;
      height: 48px;
      border-radius: var(--border-radius-md);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 30%, var(--text-link) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    /* Desactivar menú superior en responsive móvil para forzar menú inferior estilo Spotify */
    @media (max-width: 1023px) {
      .sidebar .nav-menu {
        display: none;
      }
      .sidebar {
        padding: 1rem;
        align-items: center;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .brand {
        margin-bottom: 0;
      }
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: var(--border-radius-md);
      font-weight: 500;
      font-size: 0.95rem;
      transition: var(--transition-standard);
    }

    .nav-link svg {
      width: 20px;
      height: 20px;
      transition: var(--transition-standard);
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      background-color: rgba(75, 0, 255, 0.15);
    }

    .nav-link.active svg {
      color: var(--accent-neon);
      transform: scale(1.15);
    }

    /* BARRA DE NAVEGACIÓN INFERIOR (MOBILE EXCLUSIVO) */
    .mobile-tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: rgba(9, 9, 13, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (min-width: 1024px) {
      .mobile-tabbar {
        display: none;
      }
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 500;
      gap: 4px;
      flex: 1;
      height: 100%;
      transition: var(--transition-standard);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
    }

    .tab-item.active {
      color: var(--text-main);
    }
    .tab-item.active svg {
      color: var(--accent-neon);
    }

    /* CONTENEDOR DE CONTENIDO PRINCIPAL */
    .main-viewport {
      flex: 1;
      padding-bottom: 80px; /* Margen para tabbar */
    }

    @media (min-width: 1024px) {
      .main-viewport {
        margin-left: var(--spacing-sidebar);
        padding-bottom: 0;
      }
    }

    .view-section {
      padding: 2.5rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      animation: viewFadeIn 0.4s ease-out forwards;
    }

    @media (min-width: 768px) {
      .view-section {
        padding: 4rem 3rem;
      }
    }

    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HERO SECTION STYLE */
    .hero {
      position: relative;
      background: radial-gradient(circle at top right, rgba(75,0,255,0.2), transparent 50%),
                  linear-gradient(to bottom, var(--bg-panel) 0%, var(--bg-absolute) 100%);
      border-radius: var(--border-radius-lg);
      padding: 3rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 3rem;
    }

    @media (min-width: 768px) {
      .hero {
        flex-direction: row;
        align-items: center;
        padding: 4rem;
        gap: 4rem;
      }
    }

    .hero-image-wrapper {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--primary);
      box-shadow: 0 0 30px var(--primary-glow);
      flex-shrink: 0;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .hero-image-wrapper {
        width: 280px;
        height: 280px;
        margin: 0;
      }
    }

    .hero-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-info {
      flex: 1;
      text-align: center;
    }

    @media (min-width: 768px) {
      .hero-info {
        text-align: left;
      }
    }

    .badge-panama {
      background: rgba(75, 0, 255, 0.3);
      border: 1px solid var(--accent-neon);
      color: var(--accent-neon);
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: inline-flex;
      margin-bottom: 1rem;
      align-items: center;
      gap: 6px;
    }

    .badge-panama::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-neon);
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }

    @media (min-width: 768px) {
      .hero-title {
        font-size: 4rem;
      }
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .hero-actions {
        justify-content: flex-start;
      }
    }

    /* BOTONES GLOBALES */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.85rem 1.75rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition-standard);
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--text-main);
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-spotify {
      background-color: var(--spotify-green);
      color: #000;
    }

    .btn-spotify:hover {
      background-color: #1ed760;
      transform: translateY(-2px);
    }

    /* SECCIONES Y ENCABEZADOS */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      position: relative;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 40px;
      height: 4px;
      background: var(--primary);
      margin-top: 0.5rem;
      border-radius: 2px;
    }

    /* SPOTIFY SONGS LIST - POPULARES */
    .spotify-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--bg-panel);
      padding: 1.5rem;
      border-radius: var(--border-radius-lg);
      border: 1px solid rgba(255,255,255,0.03);
    }

    .track-row {
      display: grid;
      grid-template-columns: 40px 1fr 100px 50px;
      align-items: center;
      padding: 0.75rem;
      border-radius: var(--border-radius-md);
      transition: var(--transition-standard);
      cursor: pointer;
    }

    .track-row:hover {
      background-color: var(--bg-panel-hover);
    }

    .track-index {
      color: var(--text-muted);
      font-weight: 600;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .track-cover-mini {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background-color: var(--primary);
      overflow: hidden;
      flex-shrink: 0;
    }

    .track-cover-mini svg, .track-cover-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-title-info {
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .track-duration {
      text-align: right;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .track-action {
      display: flex;
      justify-content: flex-end;
    }

    .track-play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: var(--transition-standard);
    }

    .track-row:hover .track-play-btn {
      background: var(--text-main);
      color: var(--bg-absolute);
      border-color: var(--text-main);
    }

    /* DYNAMIC VIDEO ROW ON HOME */
    .featured-video-spotlight {
      background: linear-gradient(135deg, rgba(75,0,255,0.2) 0%, rgba(9,9,13,0.8) 100%), var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--border-radius-lg);
      overflow: hidden;
      margin-bottom: 3rem;
    }

    .spotlight-grid {
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .spotlight-grid {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    .spotlight-thumb {
      position: relative;
      aspect-ratio: 16/9;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .spotlight-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      transition: var(--transition-standard);
    }

    .spotlight-thumb:hover::after {
      background: rgba(0,0,0,0.2);
    }

    .btn-play-video {
      position: relative;
      z-index: 2;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--text-main);
      color: var(--bg-absolute);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: var(--transition-standard);
    }

    .spotlight-thumb:hover .btn-play-video {
      transform: scale(1.1);
      background: var(--primary);
      color: var(--text-main);
    }

    .spotlight-body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    /* GRID DE DISCOGRAFÍA Y ELEMENTOS */
    .release-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .release-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .release-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
      }
    }

    .release-card {
      background-color: var(--bg-panel);
      border-radius: var(--border-radius-md);
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      text-decoration: none;
      color: var(--text-main);
      transition: var(--transition-standard);
      display: flex;
      flex-direction: column;
    }

    .release-card:hover {
      background-color: var(--bg-panel-hover);
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .release-cover-container {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1rem;
      background: var(--bg-absolute);
      position: relative;
    }

    .release-cover-container img, .release-cover-container svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .release-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      color: var(--text-main);
      padding: 0.25rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 700;
      border-radius: 4px;
    }

    .release-title {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.3;
      margin-bottom: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .release-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* FILTROS / PESTAÑAS (TABS INTERNAS) */
    .tabs-navigation {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .tab-button {
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: var(--transition-standard);
    }

    .tab-button:hover, .tab-button.active {
      background-color: var(--primary);
      color: var(--text-main);
      border-color: var(--primary);
    }

    /* DETALLE DE DISCO / RELEASE */
    .release-detail {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    @media (min-width: 768px) {
      .release-detail {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .release-detail-cover {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1/1;
      border-radius: var(--border-radius-lg);
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      margin: 0 auto;
      background: var(--bg-panel);
    }

    @media (min-width: 768px) {
      .release-detail-cover {
        margin: 0;
      }
    }

    .release-detail-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .release-detail-info {
      flex: 1;
    }

    .release-detail-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .release-detail-meta-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .release-detail-meta-list strong {
      color: var(--text-main);
    }

    /* GRID DE VIDEOS */
    .videos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .videos-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .videos-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .video-card {
      background-color: var(--bg-panel);
      border-radius: var(--border-radius-md);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: var(--transition-standard);
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .video-thumbnail-container {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--bg-absolute);
    }

    .video-thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .video-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      opacity: 0;
      transition: var(--transition-standard);
    }

    .video-card:hover .video-play-overlay {
      opacity: 1;
    }

    .video-play-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-info {
      padding: 1rem;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .video-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* FORMULARIO DE BUSQUEDA */
    .search-bar-wrapper {
      margin-bottom: 2rem;
    }

    .search-input {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      padding: 1rem 1.5rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      transition: var(--transition-standard);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* SERVICIOS / COMPRA */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    @media (min-width: 768px) {
      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    .service-card {
      background-color: var(--bg-panel);
      border-radius: var(--border-radius-lg);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: var(--transition-standard);
      display: flex;
      flex-direction: column;
    }

    .service-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);

    .service-icon {
      color: var(--accent-neon);
      margin-bottom: 1.5rem;
    }

    .service-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1rem;

    .service-desc {

      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .service-cta {
      margin-top: auto;
    }

    /* FORMULARIO DE CONTACTO */
    .contact-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
    }

    @media (min-width: 1024px) {
      .contact-container {
        grid-template-columns: 1fr 1.2fr;
      }
    }

    .contact-info-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .social-link-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg-panel);
      padding: 1rem;
      border-radius: var(--border-radius-md);
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      transition: var(--transition-standard);
      border: 1px solid rgba(255, 255, 255, 0.02);

      letter-spacing: 0.05em;

      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition-standard);
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .presskit-header-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: var(--border-radius-lg);
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,0.05);

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 2rem;

      border-collapse: collapse;
      margin-top: 1.5rem;
      background: var(--bg-panel);
      border-radius: var(--border-radius-lg);
      overflow: hidden;
    }

    .ai-identity-table th, .ai-identity-table td {
      padding: 1rem 1.5rem;
      text-align: left;
    }

    .ai-identity-table th {
      background: rgba(75, 0, 255, 0.2);
      font-weight: 700;
      color: var(--accent-neon);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    .ai-identity-table tr {
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .ai-identity-table tr:last-child {
      border-bottom: none;
    }

    .ai-identity-table td strong {
      color: var(--text-muted);
    }

    /* LIGHTBOX DIALOG WINDOW (YOUTUBE PORTABLE PLAYER) */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(9, 9, 13, 0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(8px);
    }

    .lightbox-backdrop.active {
      display: flex;
    }

    .lightbox-content-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background-color: #000;
      border-radius: var(--border-radius-lg);
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .lightbox-close-btn {
      position: absolute;
      top: -45px;
      right: 0;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-standard);
    }

    .lightbox-close-btn:hover {
      color: var(--accent-neon);
      transform: scale(1.1);
    }

    .lightbox-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* FOOTER (ZONA FINAL) */
    .footer-zone {
      background-color: var(--bg-absolute);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 4rem 1.5rem 6rem;
      text-align: center;

    .footer-logo {

    .footer-links {

    .footer-link {

    .footer-link:hover {

      color: var(--text-muted);
      font-size: 0.8rem;

      stroke-width: 2;

      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;

    const Router = {
      routes: {},
      
      addRoute: function(path, handler) {
        this.routes[path] = handler;
      },
      
      resolve: function() {
        const hash = window.location.hash || '#/';
        
        // Manejo de rutas parametrizadas (por ejemplo: #/album/id o #/release/id)
        let matchedHandler = null;
        let params = {};

        for (const routePath in this.routes) {
          const routeRegex = new RegExp("^" + routePath.replace(/:[^\s/]+/g, "([\\w-]+)") + "$");
          const match = hash.match(routeRegex);
          if (match) {
            matchedHandler = this.routes[routePath];
            const paramNames = (routePath.match(/:[^\s/]+/g) || []).map(p => p.slice(1));
            paramNames.forEach((name, idx) => {
              params[name] = match[idx + 1];
            });
            break;
          }
        }

        if (matchedHandler) {
          matchedHandler(params);
        } else {
          // Fallback a home si la ruta no coincide
          window.location.hash = '#/';
        }
        
        this.updateActiveLinks(hash);
        window.scrollTo(0, 0);
      },

      updateActiveLinks: function(currentHash) {
        // Normalizar hash principal para clases active
        let activeRoute = 'home';
        if (currentHash.startsWith('#/musica') || currentHash.startsWith('#/album') || currentHash.startsWith('#/release')) activeRoute = 'musica';
        else if (currentHash.startsWith('#/videos')) activeRoute = 'videos';
        else if (currentHash.startsWith('#/sobre-joe')) activeRoute = 'sobre-joe';
        else if (currentHash.startsWith('#/prensa')) activeRoute = 'prensa';
        else if (currentHash.startsWith('#/contacto')) activeRoute = 'contacto';
        else if (currentHash.startsWith('#/ai')) activeRoute = 'ai';

        document.querySelectorAll('[data-route]').forEach(link => {
          if (link.getAttribute('data-route') === activeRoute) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }
    };

      const message = document.getElementById('messageText').value;

Me comunico desde tu sitio oficial para consultar sobre: *${service}*.
• Presupuesto estimado: ${budget}
• Detalle del proyecto: ${message}`;

      const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodedText}`;

      window.open(url, '_blank');
    };
