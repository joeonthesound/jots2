  <style>
    :root {
      --primary: #5200ff;
      --primary-hover: #6e24ff;
      --primary-glow: rgba(82, 0, 255, 0.4);
      --accent: #f2ff5e;
      --accent-hover: #e1ff00;
      --bg-absolute: #050508;
      --bg-panel: #0d0d14;
      --bg-panel-hover: #141421;
      --text-main: #ffffff;
      --text-muted: #8a8a9e;
      --text-light: #d8d8e5;
      --border-color: rgba(255, 255, 255, 0.05);
      --border-accent: rgba(242, 255, 94, 0.2);
      --transition-standard: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-width: 280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-absolute);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-absolute);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-panel);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* CONTENEDOR CENTRAL */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @media (min-width: 1024px) {
      .app-wrapper {
        flex-direction: row;
      }
    }

    /* SIDEBAR (DESKTOP) Y TOPBAR (MOBILE) */
    .app-sidebar {
      background-color: var(--bg-absolute);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .app-sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        border-bottom: none;
        border-right: 1px solid var(--border-color);
        z-index: 50;
        overflow-y: auto;
      }
    }

    /* ESTILO LOGO */
    .brand-section {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: var(--text-main);
      margin-bottom: 2rem;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 8px;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* MENÚS DE NAVEGACIÓN DESKTOP */
    .sidebar-nav {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (min-width: 1024px) {
      .sidebar-nav {
        display: flex;
      }
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition-standard);
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text-main);
      background-color: rgba(82, 0, 255, 0.15);
    }

    .nav-btn.active {
      border-left: 3px solid var(--accent);
      color: var(--accent);
    }

    /* MENU DE NAVEGACION INFERIOR SMARTPHONE */
    .mobile-nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: rgba(5, 5, 8, 0.98);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 99;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (min-width: 1024px) {
      .mobile-nav-bar {
        display: none;
      }
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 500;
      gap: 4px;
      flex: 1;
      height: 100%;
    }

    .mobile-nav-item svg {
      width: 20px;
      height: 20px;
    }

    .mobile-nav-item.active {
      color: var(--accent);
    }

    /* CONTENEDOR DE CONTENIDO PRINCIPAL */
    .main-content {
      flex: 1;
      padding-bottom: 140px; /* Margen para docks flotantes en responsive */
    }

    @media (min-width: 1024px) {
      .main-content {
        margin-left: var(--sidebar-width);
        padding-bottom: 100px;
      }
    }

    /* PERSISTENT PLATFORMS DOCK (STATIONARY/STICKY) */
    .music-dock {
      position: fixed;
      bottom: 64px; /* Arriba de la barra de navegación móvil */
      left: 0;
      right: 0;
      height: 48px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      overflow-x: auto;
      white-space: nowrap;
      padding: 0 1rem;
      gap: 1.5rem;
      border-top: 1px solid var(--border-accent);
    }

    @media (min-width: 1024px) {
      .music-dock {
        bottom: 0;
        left: var(--sidebar-width);
        height: 56px;
        gap: 2rem;
      }
    }

    .dock-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
    }

    .dock-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .dock-link {
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-standard);
    }

    .dock-link:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* MÁRGENES Y CONTENEDOR DE SECCIONES INTERNAS */
    .view-section {
      padding: 1.5rem 1rem 6rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
      animation: viewFadeIn 0.3s ease-out forwards;
    }

    @media (min-width: 1024px) {
      .view-section {
        padding: 3.5rem 2.5rem;
      }
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .highlight-word {
      color: var(--accent);
      background: linear-gradient(120deg, transparent 0%, rgba(242, 255, 94, 0.1) 100%);
      padding: 0 4px;
    }

    /* HERO BANNER */
    .hero-banner {
      background: radial-gradient(circle at center, rgba(82,0,255,0.15) 0%, transparent 70%), var(--bg-panel);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero-banner {
        flex-direction: row;
        align-items: center;
        padding: 4rem 3rem;
      }
    }

    .hero-thumb {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--primary-glow);
      flex-shrink: 0;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .hero-thumb {
        width: 180px;
        height: 180px;
        margin: 0;
      }
    }

    .hero-body {
      flex: 1;
      text-align: center;
    }

    @media (min-width: 768px) {
      .hero-body {
        text-align: left;
      }
    }

    .hero-title-main {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 1rem;
      letter-spacing: -0.05em;
    }

    .hero-desc {
      font-size: 1.05rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    /* SPOTLIGHT */
    .featured-video-spotlight {
      background: var(--bg-panel); 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      overflow: hidden; 
      margin-bottom: 3rem;
    }

    .spotlight-grid {
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .spotlight-grid {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    /* RELEASES Y POPULARES */
    .home-flex-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      margin-bottom: 3rem;
    }

    @media (min-width: 1024px) {
      .home-flex-grid {
        grid-template-columns: 1.4fr 1fr;
      }
    }

    /* GRID DE DISCOS */
    .release-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .release-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1.5rem;
      }
    }

    .release-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      text-decoration: none;
      color: var(--text-main);
      transition: var(--transition-standard);
      display: flex;
      flex-direction: column;
    }

    .release-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .release-cover-container {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 1rem;
      background: var(--bg-absolute);
      position: relative;
    }

    .release-cover-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .release-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      color: var(--accent);
      padding: 0.25rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 800;
      border-radius: 4px;
    }

    .release-title {
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .release-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* DETALLES DE LANZAMIENTOS */
    .release-detail {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .release-detail {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .release-detail-cover {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .release-detail-cover {
        margin: 0;
      }
    }

    .release-detail-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .release-detail-info {
      flex: 1;
    }

    .release-detail-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      margin-bottom: 1rem;
    }

    .release-detail-meta-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      color: var(--text-light);
    }

    /* SPOTIFY LISTS (POPULARES) */
    .spotify-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--bg-panel);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .track-row {
      display: grid;
      grid-template-columns: 32px 1fr 64px 40px;
      align-items: center;
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition-standard);
    }

    .track-row:hover {
      background-color: var(--bg-panel-hover);
    }

    .track-index {
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .track-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .track-cover-mini {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--bg-absolute);
      flex-shrink: 0;
    }

    .track-cover-mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-title-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .track-title {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .track-duration {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
    }

    .track-action {
      display: flex;
      justify-content: flex-end;
    }

    .track-play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
    }

    .track-row:hover .track-play-btn {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* GRID DE DIFERENCIACIÓN */
    .differentiator-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    @media (min-width: 768px) {
      .differentiator-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1200px) {
      .differentiator-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .diff-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      transition: var(--transition-standard);
      position: relative;
    }

    .diff-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .diff-card-num {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2.5rem;
      font-weight: 900;
      color: rgba(255,255,255,0.03);
      line-height: 1;
    }

    .diff-card-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
    }

    .diff-card-text {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    /* TABLA DE CRECIMIENTO */
    .growth-metric-table-wrapper {
      background: var(--bg-panel);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin-bottom: 3rem;
    }

    .growth-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 600px;
    }

    .growth-table th, .growth-table td {
      padding: 1.25rem 1.5rem;
    }

    .growth-table th {
      background: rgba(82, 0, 255, 0.1);
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      border-bottom: 2px solid var(--border-color);
    }

    .growth-table tr {
      border-bottom: 1px solid var(--border-color);
    }

    .growth-table tr:last-child {
      border-bottom: none;
    }

    .growth-platform-cell {
      font-weight: 800;
      text-transform: uppercase;
      font-size: 1rem;
    }

    .growth-stat-past {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .growth-stat-proj {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .growth-footnote {
      padding: 1rem 1.5rem;
      background: rgba(0,0,0,0.2);
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }

    /* MANIFIESTO */
    .manifiesto-box {
      border-left: 4px solid var(--accent);
      padding: 1.5rem;
      background: rgba(242, 255, 94, 0.03);
      border-radius: 0 12px 12px 0;
      margin-bottom: 2.5rem;
    }

    .manifiesto-quote {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      font-style: italic;
      color: var(--text-main);
    }

    /* GRID DE VIDEOS Y CARDS */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .video-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition-standard);
    }

    .video-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
    }

    .video-thumbnail-container {
      position: relative;
      aspect-ratio: 16/9;
      background-color: #000;
    }

    .video-thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: var(--transition-standard);
    }

    .video-card:hover .video-play-overlay {
      opacity: 1;
    }

    .video-play-icon {
      font-size: 2rem;
      color: var(--accent);
    }

    .video-info {
      padding: 1rem;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .search-bar-wrapper {
      margin-bottom: 2rem;
    }

    .search-input {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      border-radius: 50px;
      color: white;
      font-size: 1rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* BADGE PANAMA */
    .badge-panama {
      background: rgba(82,0,255,0.25);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.3rem 0.75rem;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-flex;
      margin-bottom: 1rem;
    }

    /* BOTONES */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.75rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition-standard);
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-accent {
      background-color: var(--accent);
      color: #000000;
    }

    .btn-accent:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* CONTACT CONED */
    .contact-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 1024px) {
      .contact-container {
        grid-template-columns: 1fr 1.2fr;
      }
    }

    /* LIGHTBOX ACCESIBLE */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(5, 5, 8, 0.96);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(12px);
    }

    .lightbox-backdrop.active {
      display: flex;
    }

    .lightbox-content-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .lightbox-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-standard);
      z-index: 10;
    }

    .lightbox-close-btn:hover {
      background-color: var(--accent);
      color: #000;
    }

    .lightbox-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* TOAST */
    .custom-toast {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: var(--bg-panel);
      color: var(--text-main);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border-left: 4px solid var(--accent);
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .custom-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 1024px) {
      .custom-toast {
        bottom: 24px;
        right: 24px;
      }
    }

    const Lightbox = {
      open: function(videoId) {
        const container = document.getElementById('lightboxIframeContainer');
        if (!container) return;
        container.innerHTML = `
          <iframe 
            class="lightbox-iframe"
            src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" 
            title="Reproductor de YouTube"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
        const modal = document.getElementById('youtubeLightbox');
        if (modal) modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      },
      close: function() {
        const modal = document.getElementById('youtubeLightbox');
        if (modal) modal.classList.remove('active');
        const container = document.getElementById('lightboxIframeContainer');
        if (container) container.innerHTML = '';
        document.body.style.overflow = '';
      }
    };

    // ROUTER SPA MOTOR
    const Router = {
      routes: {},
      addRoute: function(path, handler) { this.routes[path] = handler; },
      resolve: function() {
        const hash = window.location.hash || '#/';
        let matchedHandler = null;
        let params = {};

        for (const routePath in this.routes) {
          const routeRegex = new RegExp("^" + routePath.replace(/:[^\s/]+/g, "([\\w-]+)") + "$");
          const match = hash.match(routeRegex);
          if (match) {
            matchedHandler = this.routes[routePath];
            const paramNames = (routePath.match(/:[^\s/]+/g) || []).map(p => p.slice(1));
            paramNames.forEach((name, idx) => { params[name] = match[idx + 1]; });
            break;
          }
        }

        if (matchedHandler) { matchedHandler(params); } else { window.location.hash = '#/'; }
        this.updateActiveLinks(hash);
        window.scrollTo(0, 0);
      },
      updateActiveLinks: function(currentHash) {
        let activeRoute = 'home';
        if (currentHash.startsWith('#/proyecto')) activeRoute = 'proyecto';
        else if (currentHash.startsWith('#/musica') || currentHash.startsWith('#/release') || currentHash.startsWith('#/album')) activeRoute = 'musica';
        else if (currentHash.startsWith('#/videos')) activeRoute = 'videos';
        else if (currentHash.startsWith('#/servicios')) activeRoute = 'servicios';
        else if (currentHash.startsWith('#/sobre-joe')) activeRoute = 'sobre-joe';
        else if (currentHash.startsWith('#/prensa')) activeRoute = 'prensa';
        else if (currentHash.startsWith('#/contacto')) activeRoute = 'contacto';
        else if (currentHash.startsWith('#/ai')) activeRoute = 'ai';

        document.querySelectorAll('[data-route]').forEach(link => {
          if (link.getAttribute('data-route') === activeRoute) link.classList.add('active');
          else link.classList.remove('active');
        });
      }
    };

      });

      document.getElementById('viewport').innerHTML = `

          <h1 class="section-title">Canal de <span class="highlight-word">Videos</span></h1>
          <div class="search-bar-wrapper">

          </div>
          <div class="videos-grid">${videosHTML || '<p style="color:var(--text-muted);">No se encontraron videos.</p>'}</div>

    // SISTEMA DE TOAST PREMIUM (REEMPLAZA EL ALERT TRADICIONAL)
    window.showToast = function(message) {
      const existingToast = document.querySelector('.custom-toast');
      if (existingToast) {
        existingToast.remove();
      }

      const toast = document.createElement('div');
      toast.className = 'custom-toast';
      toast.textContent = message;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('show');
      }, 50);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          toast.remove();
        }, 300);
      }, 3500);
    };

    // INICIALIZADOR DE EVENTOS DE LIGHTBOX

        });
      }
    });

    window.addEventListener('keydown', function(e) {
